name: Build and Release Custom Unsigned APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Force Debug Signing on Release
        run: |
          sed -i '/release {/a \            signingConfig = signingConfigs.getByName("debug")' app/build.gradle.kts

      - name: Build Generic Release APK
        run: ./gradlew assembleGenericRelease --no-daemon

      - name: Create Automatic Release with marvinpinto
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Tasks Custom Build (Unsigned)"
          files: |
            app/build/outputs/apk/generic/release/*.apk
