name: Build and Release Custom Signed APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Generic Release APK
        run: ./gradlew assembleGenericRelease --no-daemon

      - name: Sign APK with Test Key
        run: |
          keytool -genkey -v -keystore test.keystore -storepass android -alias test -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test"
          UNSIGNED_APK=$(ls app/build/outputs/apk/generic/release/*.apk | head -n 1)
          apksigner sign --ks test.keystore --ks-pass pass:android --ks-key-alias test --out app/build/outputs/apk/generic/release/tasks-test-signed.apk "$UNSIGNED_APK"

      - name: Create Automatic Release with marvinpinto
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Tasks Custom Signed Build"
          files: |
            app/build/outputs/apk/generic/release/tasks-test-signed.apk
